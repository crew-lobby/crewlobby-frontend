# Coolify Docker Compose build pack (Git source).
# Set BACKEND_URL to the URL generated by the backend Coolify resource.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${BACKEND_URL:?}
        NEXT_PUBLIC_AUTH_URL: ${BACKEND_URL:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${BACKEND_URL:?}
      NEXT_PUBLIC_AUTH_URL: ${BACKEND_URL:?}
      SERVICE_URL_FRONTEND_3000: /
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
